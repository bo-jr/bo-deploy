# bo-deploy's required check. Its logic lives in bo-platform, pinned by commit
# SHA, so changing what the gate checks is a deliberate re-pin here.
#
# Required by the `deploy-checks` ruleset (bo-platform: task
# repos:protect:deploy-checks) under the check-run name "validate / rendered".
# Without a required check, auto-merge would merge every dev PR on sight.
name: validate

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  validate:
    # bo-jr/bo-platform#14 (phase-3/ci), merged as c1c04cd
    uses: bo-jr/bo-platform/.github/workflows/deploy-validate.yml@c1c04cdd638a593198e427ddbcb10676460044f2
    permissions:
      contents: read
